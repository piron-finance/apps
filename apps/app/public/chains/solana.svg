    </linearGradient>
  </defs>
  <path d="M7.4 7.1h10.1a.5.5 0 0 1 .35.85l-1.6 1.6a.5.5 0 0 1-.35.15H5.8a.5.5 0 0 1-.35-.85l1.6-1.6a.5.5 0 0 1 .35-.15Z" fill="url(#sol)"/>
